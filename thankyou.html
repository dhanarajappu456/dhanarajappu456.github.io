<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message sent | Dhanaraj S</title>
  <meta name="theme-color" content="#3D33E8" />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root{
      --paper:#EDEFF5;--surface:#fff;--ink:#15173D;--ink-soft:#4A4F73;--hair:rgba(21,23,61,.12);
      --cobalt:#3D33E8;--cobalt-dk:#2B22C4;--tide:#22B5A7;--sun:#F5B82E;--buoy:#F0453A;
      --font-d:"Anybody","Arial Black","Helvetica Neue",sans-serif;
      --font-b:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
      --ease-out:cubic-bezier(.16,1,.3,1);
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100%}
    body{font-family:var(--font-b);color:var(--ink);background:var(--paper);overflow-x:hidden;-webkit-font-smoothing:antialiased;
      background-image:radial-gradient(rgba(21,23,61,.13) 1px, transparent 1.2px);background-size:26px 26px}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:6px}
    .wrap{min-height:100svh;display:grid;grid-template-rows:1fr auto;padding:clamp(28px,6vw,64px) clamp(20px,5vw,56px) 0}
    .card{align-self:center;width:min(980px,100%);margin:0 auto}
    .check{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--tide);color:#fff;font-size:32px;
      box-shadow:0 0 0 10px rgba(34,181,167,.16);animation:pop .8s var(--ease-out) both}
    @keyframes pop{from{transform:scale(.3);opacity:0}}
    h1{font-family:var(--font-d);font-weight:850;font-stretch:150%;font-size:clamp(3rem,10vw,7.4rem);line-height:.9;letter-spacing:-.04em;color:var(--cobalt);margin:30px 0 22px}
    .lead{font-size:clamp(1.1rem,2.2vw,1.35rem);line-height:1.55;max-width:46ch}
    .typing{margin-top:14px;min-height:1.6em;font-weight:600;color:var(--ink-soft);font-size:1.05rem}
    .cursor{display:inline-block;width:2px;height:1.05em;margin-left:3px;background:var(--cobalt);vertical-align:-.15em;animation:blink 1s steps(2,end) infinite}
    @keyframes blink{50%{opacity:0}}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
    .btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font-weight:600;border:1.5px solid transparent;transition:background .2s,color .2s,border-color .2s}
    .btn.primary{background:var(--cobalt);color:#fff;box-shadow:0 10px 30px -12px rgba(61,51,232,.7)}
    .btn.primary:hover{background:var(--cobalt-dk)}
    .btn.ghost{border-color:var(--ink)}
    .btn.ghost:hover{background:var(--ink);color:var(--paper)}
    .mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:56px;background:var(--surface);border-radius:24px;box-shadow:0 0 0 1px var(--hair);overflow:hidden}
    .mini{padding:22px 24px;border-right:1px solid var(--hair)}
    .mini:last-child{border-right:0}
    .mini b{display:block;font-family:var(--font-d);font-weight:760;font-stretch:120%;font-size:1.25rem;margin-bottom:4px}
    .mini span{color:var(--ink-soft);font-size:.95rem}
    .footer-note{margin:48px -56px 0;padding:24px 56px;background:var(--ink);color:#A3A7CB;font-size:.92rem}
    .confetti{position:fixed;top:-16px;width:9px;height:16px;border-radius:3px;opacity:.95;animation:fall linear forwards;z-index:4;pointer-events:none}
    @keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.1}}
    @media(max-width:640px){
      .mini-grid{grid-template-columns:1fr}
      .mini{border-right:0;border-bottom:1px solid var(--hair)}
      .mini:last-child{border-bottom:0}
      .btn{flex:1 1 100%;justify-content:center}
      .footer-note{margin:40px -20px 0;padding:20px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Message sent confirmation">
      <div class="check" aria-hidden="true"><i class="fa-solid fa-check"></i></div>
      <h1>Thank you!</h1>
      <p class="lead">Your message has been sent. I’ll read it and get back to you soon.</p>
      <p class="typing"><span id="thankType">Connecting ideas to engineering outcomes</span><span class="cursor" aria-hidden="true"></span></p>
      <div class="actions">
        <a class="btn primary" href="index.html#home"><i class="fa-solid fa-house"></i> Back to portfolio</a>
        <a class="btn ghost" href="index.html#projects"><i class="fa-solid fa-diagram-project"></i> View projects</a>
        <a class="btn ghost" href="https://topmate.io/dhanaraj_sujatha10/"><i class="fa-solid fa-calendar-check"></i> Book mentorship</a>
      </div>
      <div class="mini-grid">
        <div class="mini"><b>Software</b><span>Full-stack systems</span></div>
        <div class="mini"><b>AI</b><span>LLM products</span></div>
        <div class="mini"><b>Mentoring</b><span>DSA &amp; interviews</span></div>
      </div>
    </section>
    <p class="footer-note">Dhanaraj S · Software Engineer &amp; AI systems builder</p>
  </main>
  <script>
    (() => {
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const words = ["Building scalable software","Designing AI products","Creating developer tools","Solving real-world problems","Mentoring future engineers"];
      const el = document.getElementById("thankType");
      let wi = 0, ci = 0, del = false;
      function type(){
        const w = words[wi]; el.textContent = w.slice(0, ci);
        if (!del && ci < w.length) ci++;
        else if (!del) { del = true; setTimeout(type, 1200); return; }
        else if (ci > 0) ci--;
        else { del = false; wi = (wi + 1) % words.length; }
        setTimeout(type, del ? 38 : 70);
      }
      if (!reduced) setTimeout(type, 1400);
      if (reduced) return;
      const colors = ["#3D33E8","#22B5A7","#F5B82E","#F0453A","#15173D","#8F88FF"];
      for (let i = 0; i < 72; i++) {
        const c = document.createElement("i"); c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw"; c.style.background = colors[i % colors.length];
        c.style.setProperty("--x", (Math.random() * 220 - 110) + "px");
        c.style.animationDuration = (2.4 + Math.random() * 3.2) + "s";
        c.style.animationDelay = (Math.random() * 1.2) + "s";
        document.body.appendChild(c); setTimeout(() => c.remove(), 7000);
      }
    })();
  </script>
</body>
</html>
